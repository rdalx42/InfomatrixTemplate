
<!doctype html>

<html>

    <head>
        <title>Home</title>
        <meta charset="utf-8">
        <link rel="stylesheet" type="text/css" href="../static/style/main.css?v=1.3">
    </head>

    <img class="BgImage"
         src="{% if greeting == 'Good Morning' %}/static/images/goodmorning.png
              {% elif greeting == 'Good Evening' %}/static/images/goodevening.png
              {% else %}/static/images/goodnight.png
              {% endif %}">

    <form method = "POST">
        <div class = "TopBar">
            <h2>{{greeting}}</h2>
            <button class="logout" type="submit" name="action" value="Logout">Logout</button>
        </div>
    </form>
</html>
